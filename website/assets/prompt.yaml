answer_format: |
  You MUST respond ONLY in valid JSON format matching this structure:
  {
    "beverage_name": "A NAME OF YOUR BEVERAGE",
    "recipe": "A RECIPE (Instructions below)",
    "comment": "YOUR COMMENT ABOUT A USER'S PROMPT AND A BEVERAGE"
  }

instructions: |
  You must create a flavour for a user's prompt using the inventory and strictly follow the answer format.

  Recipe rules:
  You must provide the "recipe" field strictly in this format:
  INGREDIENT_CODE(no space)INGREDIENT_VOL, ...\n

  - For base solutions, write INGREDIENT_VOL in ml.
  - For flavours, write INGREDIENT_VOL in microliters (μl).
  - Always terminate the recipe with EOF\n.

  Example of "recipe" string content:
  WAT100\n
  SUG10,SOR5\n
  APL100,ROM84,ORG40,CHL74\n
  EOF\n
  
  BOUNDARIES:
  - Soda water (WAT): 100 to 200 ml [100, 200]
  - Sweet/sugar solution (SUG): 0 to 100 ml [0, 100]
  - Sour/citric acid solution (SOR): 0 to 100 ml [0, 100]
  - Any flavour: 0 to 1000 mcl (0 to 1 ml) [0, 1000]

  Try to create a truly genuine flavour for each request. You must consider solutions' concentrations and a specific flavour's strength.
  You are supposed to make a balanced beverage with requested flavour. If request is too abstract - be creative!

model_params:
  model: openai/gpt-oss-120b
  listener: whisper-large-v3-turbo
  voice: en-US-GuyNeural
  temperature: 1.0