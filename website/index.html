<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>The Pandora Machine AI</title>

    <script type="module" src="script.js"></script>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-viewport">
        <header class="app-header">
            <div class="datetime-block">
                <span id="clock" class="time-text">00:00</span>
                <span id="date" class="date-text">Mon, Jan 01</span>
            </div>

            <div class="header-right">
                <span id="ble-dot" class="mini-status-dot disconnected" title="BLE Status"></span>

                <button id="fullscreen-btn" class="btn-icon" title="Fullscreen">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
                        <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
                        <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
                        <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
                    </svg>
                </button>

                <button id="btn-recipes" class="btn-icon" title="Recipes">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        <line x1="9" y1="7" x2="15" y2="7"></line>
                        <line x1="9" y1="11" x2="15" y2="11"></line>
                    </svg>
                </button>

                <button id="btn-test" class="btn-icon" title="Pump Test">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
                      <path d="M14.7 10.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1a2 2 0 0 0-2.8-2.8l-3.3 2.9z"/>
                    </svg>
                </button>

                <button id="btn-settings" class="btn-icon" title="Settings">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="center-zone">
            <div id="recipes-modal" class="overlay-modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Recipes</h2>
                        <button id="clear-recipes-btn" class="close-btn">Clear all</button>
                        <button id="close-recipes-btn" class="close-btn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <ul class="recipe-list"></ul>
                    </div>
                </div>
            </div>

            <div id="test-modal" class="overlay-modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Check pumps</h2>
                        <button id="close-test-btn" class="close-btn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="pump-test-section">
                            <h3 class="pump-test-label">Main pumps</h3>
                            <div class="main-pump-grid" id="main-pump-grid"></div>
                        </div>
                    
                        <div class="pump-test-divider"></div>
                    
                        <div class="pump-test-section">
                            <h3 class="pump-test-label">Flavour pumps</h3>
                            <div class="mini-pump-grid" id="mini-pump-grid"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="settings-modal" class="overlay-modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Settings</h2>
                        <button id="close-settings-btn" class="close-btn">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="setting-row column">
                            <label for="groq-key-input">Groq API Key</label>
                            <input type="password" id="groq-key-input" class="text-input" placeholder="gsk_...">
                        </div>

                        <div class="setting-row column">
                            <div class="setting-header-inline">
                                <span>BLE Devices</span>
                                <button id="scan-btn" class="action-btn">Scan for BLE</button>
                                <button id="disconnect-btn" class="action-btn">Disconnect</button>
                            </div>
                            <ul id="ble-devices-list" class="device-list"></ul>
                        </div>

                        <div class="setting-row">
                            <span>Voice Output</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="voice-output-toggle" checked>
                                <span class="slider"></span>
                            </label>
                        </div>

                        <div class="setting-row column">
                            <label for="debug-log-output">Debug Log</label>
                            <textarea id="debug-log-output" class="debug-textarea" readonly rows="5" placeholder="Logs will appear here..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <button id="btn-mic" class="orb-button" aria-label="Hold to Record">
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-core"></div>
                <div class="orb-spectrum" id="orb-spectrum">
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                    <span class="spectrum-bar"></span>
                </div>
            </button>
        </main>

        <footer class="bottom-zone">
            <div id="ai-response-text" class="ai-text-box"></div>
        </footer>
    </div>
</body>
</html>
